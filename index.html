<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Search Engine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center vh-100">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="display-1 mb-4 fw-bold text-primary">Duniya</h1>
                <form action="results.html" method="GET">
                    <input name="q" type="text" class="form-control rounded-pill-start p-3" placeholder="Search..."
                        required>
                    <div class="input-group mb-3 custom-search">
                        <input type="text" class="form-control rounded-pill-start p-3"
                            placeholder="Search bar" required>
                        <button class="btn btn-primary rounded-pill-end px-4" type="submit">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
